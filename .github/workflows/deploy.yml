name: Mitsumi AI Platform CI/CD

# TRIGGERS - When to run
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

# ENVIRONMENT VARIABLES
env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: mitsumi-api
  ECS_CLUSTER: mitsumi-cluster-prod
  ECS_SERVICE: mitsumi-api-service-prod
  CONTAINER_NAME: api

# JOBS 
jobs:
  # JOB 1: LINT Code Quality Check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install black flake8 mypy

      - name: Run linters
        run: |
          black --check backend/
          flake8 backend/ --max-line-length=120
          mypy backend/ --ignore-missing-imports

  # JOB 2: TEST - Unit Tests
  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test_key
        run: |
          pytest backend/tests/ \
            --cov=backend/app \
            --cov-report=xml \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # JOB 3: SECURITY SCAN
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JOB 4: BUILD & PUSH DOCKER IMAGE
  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    outputs:
      image-tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile.production \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.build.outputs.tag }}
          format: 'sarif'
          output: 'image-results.sarif'
          severity: 'CRITICAL,HIGH'

  # JOB 5: DEPLOY TO STAGING 
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.mitsumi.ai
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster mitsumi-cluster-staging \
            --service mitsumi-api-service-staging \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Run database migrations
        run: |
          aws ecs run-task \
            --cluster mitsumi-cluster-staging \
            --task-definition mitsumi-migration-staging \
            --overrides '{"containerOverrides":[{"name":"migration","command":["alembic","upgrade","head"]}]}'

      - name: Verify deployment
        run: |
          sleep 30
          curl -f https://staging.mitsumi.ai/health

  # JOB 6: DEPLOY TO PRODUCTION (APPROVAL)
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.mitsumi.ai
    steps:
      - uses: actions/checkout@v4

      - name: Manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: 'admin1,admin2'
          minimum-approvals: 2
          issue-title: 'Deploy to Production'
          issue-body: 'Approve deployment of ${{ github.sha }} to production?'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Deploy to ECS
        run: |
          # Get current task definition
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition mitsumi-api \
            --query taskDefinition \
            --output json)

          # Update image in task definition
          NEW_TASK_DEF=$(echo $TASK_DEF | \
            jq --arg IMAGE "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities)')

          # Register new task definition
          aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF"

          # Update service with new task definition
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition mitsumi-api \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Run database migrations
        run: |
          aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition mitsumi-migration \
            --overrides '{"containerOverrides":[{"name":"migration","command":["alembic","upgrade","head"]}]}'

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

      - name: Verify deployment
        run: |
          sleep 30
          curl -f https://api.mitsumi.ai/health

      - name: Notify success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":" Production deployment successful! 🚀\nCommit: ${{ github.sha }}\nURL: https://api.mitsumi.ai"}' \
            ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":" Production deployment failed! 😱\nCommit: ${{ github.sha }}\nCheck: https://github.com/${{ github.repository }}/actions"}' \
            ${{ secrets.SLACK_WEBHOOK }}
